site_name: planviz
site_description: >-
  Frontier-styled matplotlib figures for planning and search: grid maps,
  search animations, plan timelines, and benchmark charts.
site_url: https://openplan-labs.github.io/planviz/
repo_url: https://github.com/openplan-labs/planviz
repo_name: openplan-labs/planviz
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark-accent.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Libre Franklin
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/frontier.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Install: install.md
  - Gallery: gallery.md
  - Design rules: design-rules.md
  - API reference: api.md
  - Migration: migration.md
